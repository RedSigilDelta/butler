name: Butler I0 FOSS Debug

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-foss-debug:
    name: Build Butler I0 FOSS Debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build FOSS debug APK
        run: ./gradlew app:assembleFossDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: butler-i0-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
